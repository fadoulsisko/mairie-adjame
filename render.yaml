services:
  # Database PostgreSQL
  - type: pserv
    name: mairie-db
    ipAllowList: []
    plan: starter
    region: frankfurt

  # Backend API (Express)
  - type: web
    name: mairie-backend
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: cd mairie-instance/backend && npm install && npx prisma migrate deploy
    startCommand: cd mairie-instance/backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mairie-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "3000"

  # Frontend (Next.js)
  - type: web
    name: mairie-frontend
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: cd mairie-instance/frontend && npm install && npm run build
    startCommand: cd mairie-instance/frontend && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://mairie-backend.onrender.com/api
      - key: NODE_ENV
        value: production

  # Backoffice (React)
  - type: web
    name: mairie-backoffice
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: cd mairie-instance/backoffice && npm install && npm run build
    startCommand: cd mairie-instance/backoffice && npm start
    envVars:
      - key: REACT_APP_API_URL
        value: https://mairie-backend.onrender.com/api
      - key: NODE_ENV
        value: production
