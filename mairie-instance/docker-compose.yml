version: '3.9'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: mairie_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-mairie_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_123}
      POSTGRES_DB: ${DB_NAME:-mairie_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mairie_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mairie_network

  # Backend API (Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mairie_backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${DB_USER:-mairie_user}:${DB_PASSWORD:-secure_password_123}@postgres:5432/${DB_NAME:-mairie_db}
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key_here}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKOFFICE_URL: ${BACKOFFICE_URL:-http://localhost:3001}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    networks:
      - mairie_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend Vitrine (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mairie_frontend
    environment:
      NEXT_PUBLIC_API_URL: ${FRONTEND_API_URL:-http://localhost:3000/api}
      NEXT_PUBLIC_MAIRIE_ID: ${MAIRIE_ID:-default}
    ports:
      - "3001:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/app:/app/app
    networks:
      - mairie_network

  # Backoffice Admin (React)
  backoffice:
    build:
      context: ./backoffice
      dockerfile: Dockerfile
    container_name: mairie_backoffice
    environment:
      REACT_APP_API_URL: ${BACKOFFICE_API_URL:-http://localhost:3000/api}
      REACT_APP_MAIRIE_ID: ${MAIRIE_ID:-default}
    ports:
      - "3002:3000"
    depends_on:
      - backend
    volumes:
      - ./backoffice/src:/app/src
      - ./backoffice/public:/app/public
    networks:
      - mairie_network

  # MailHog pour développement (capture emails)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mairie_mailhog
    ports:
      - "1025:1025"   # SMTP port
      - "8025:8025"   # Web UI port
    networks:
      - mairie_network

volumes:
  postgres_data:

networks:
  mairie_network:
    driver: bridge
